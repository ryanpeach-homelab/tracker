name: Release

# Releasing is just pushing a git tag — nothing writes back to the default
# branch, so branch protection needs no exceptions. On every merged PR, the next
# version is computed from the latest tag and the PR's bump label (major / minor
# / patch, enforced by the "PR Labels" workflow), then this workflow tags it,
# publishes the container image to Docker Hub, and cuts a GitHub Release. The
# running server reports that version via TRACKER_VERSION, so `get_version` can
# tell you whether a server is up to date.
#
# Requires a repository secret DOCKERHUB_TOKEN (a Docker Hub access token for the
# rgpeach10 account with write access to the rgpeach10/tracker repository).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write # push the tag, create the Release

jobs:
  release:
    # Only on a real merge into the default branch.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tip of the default branch (includes the just-merged PR), with full
          # history + tags so we can find the latest version tag.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Determine bump level from PR labels
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          LEVEL="$(python3 - <<'PY'
          import json, os, sys
          labels = json.loads(os.environ["LABELS"])
          picked = [name for name in labels if name in ("major", "minor", "patch")]
          if len(picked) != 1:
              sys.exit(f"::error::merged PR must carry exactly one of the major/minor/patch labels (found: {picked or 'none'})")
          print(picked[0])
          PY
          )"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Compute next version from latest tag
        id: version
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
        run: |
          # Query tags straight from the remote so this never depends on what
          # the checkout fetched locally (fetch-depth/fetch-tags quirks have
          # produced an empty local tag list, which mis-computes the version).
          LATEST="$(git ls-remote --tags --refs origin 'v*' \
            | awk -F/ '{print $NF}' | sort -V | tail -n1)"
          # Split the latest tag into numeric components (defaulting to 0.0.0
          # when there are no tags yet), then bump per the label. Pure bash so
          # there's no subprocess-environment step to leak the variable through.
          base="${LATEST#v}"
          IFS=. read -r major minor patch <<EOF
          ${base:-0.0.0}
          EOF
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          case "$LEVEL" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump level '$LEVEL'"; exit 1 ;;
          esac
          VERSION="${major}.${minor}.${patch}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (from ${LATEST:-<no tags>}, ${LEVEL} bump)"

      - name: Tag the release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: rgpeach10
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        # VERSION build arg becomes TRACKER_VERSION in the image, which is what
        # get_version reports — so the image reports the tag it's published under.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            rgpeach10/tracker:v${{ steps.version.outputs.version }}
            rgpeach10/tracker:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
