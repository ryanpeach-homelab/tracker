name: PR Labels

# Every PR must declare how it bumps the version, so the Release workflow knows
# what to do on merge. Exactly one of the major / minor / patch labels is
# required. Re-runs whenever labels change so the check clears without a push.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

jobs:
  require-semver-label:
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one of major/minor/patch
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          labels = json.loads(os.environ["LABELS"])
          picked = [name for name in labels if name in ("major", "minor", "patch")]
          if len(picked) != 1:
              print(f"::error::This PR needs exactly one version-bump label — 'major', 'minor', or 'patch' — which sets how the release version bumps on merge (found: {picked or 'none'}).")
              sys.exit(1)
          print(f"OK: will bump {picked[0]} on merge.")
          PY
