services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tracking
    ports:
      - "35432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d tracking"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
